[env:sakurapi-namiji]
extends = esp32c3_base
board = esp32-c3-devkitm-1
board_level = extra
upload_protocol = esptool

build_flags =
  ${esp32c3_base.build_flags}
  -I variants/esp32c3/diy/sakurapi-namiji
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D EBYTE_E22
  -D EBYTE_E22_400M33S
  -D OPTIMIZATION_OFAST
  -D OPTIMIZATION_LTO

extra_scripts =
  ${env.extra_scripts}
  post:extra_scripts/optimizations.py

; WARN: may exceeds partition size limit with Ofast
; board_build.partitions = partition-table-t3s3.csv
