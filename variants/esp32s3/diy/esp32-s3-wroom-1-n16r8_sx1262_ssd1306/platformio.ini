[env:esp32-s3-wroom-1-n16r8_sx1262_ssd1306]
board_level = extra
extends = esp32s3_base
board = esp32-s3-wroom-1-n16r8_sx1262_ssd1306
board_build.arduino.memory_type = dio_opi
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
upload_protocol = esptool
;upload_port = /dev/ttyACM0
upload_speed = 921600
build_flags =
  ${esp32s3_base.build_flags}
  -D PRIVATE_HW
  -I variants/esp32s3/diy/esp32-s3-wroom-1-n16r8_sx1262_ssd1306
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -Ofast -ffunction-sections -fdata-sections -Wl,--gc-sections
